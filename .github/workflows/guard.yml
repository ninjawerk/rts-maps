name: Map ownership guard
# Every map belongs to whoever first published it; a push changing someone else's map is reverted (guard.py).
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check map owners
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: python3 .github/workflows/guard.py
